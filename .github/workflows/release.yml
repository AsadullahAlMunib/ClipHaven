name: Build & Release (Windows Full Bundle, Standalone .exe & Source ZIP)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.1.1) - leave blank if just testing build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App Bundles (.zip + .exe + Source)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pillow

      - name: Run Unit Tests Before Building
        run: pytest -v

      - name: Generate Windows Icon (logo.ico) & Locate Bundled FFmpeg
        shell: pwsh
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import shutil, imageio_ffmpeg
          img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([(12, 12), (244, 244)], radius=56, fill=(83, 140, 255, 255))
          draw.polygon([(128, 176), (76, 124), (108, 124), (108, 68), (148, 68), (148, 124), (180, 124)], fill=(255, 255, 255, 255))
          draw.rounded_rectangle([(72, 190), (184, 210)], radius=10, fill=(255, 255, 255, 255))
          img.save('logo.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          shutil.copyfile(ff, 'ffmpeg.exe')
          print('Prepared logo.ico and ffmpeg.exe from', ff)
          "

      - name: Build 1 — Recommended Full Windows App Folder (--onedir + bundled ffmpeg.exe)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onedir --name ClipHaven ^
            --distpath dist_dir --workpath build_dir ^
            --icon logo.ico ^
            --exclude-module tkinter ^
            --add-data "index.html;." ^
            --add-data "style.css;." ^
            --add-data "app.js;." ^
            --add-data "logo.svg;." ^
            --collect-all yt_dlp ^
            server.py

      - name: Build 2 — Standalone Single-File Executable (ClipHaven.exe)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --name ClipHaven ^
            --distpath dist_single --workpath build_single ^
            --icon logo.ico ^
            --exclude-module tkinter ^
            --add-data "index.html;." ^
            --add-data "style.css;." ^
            --add-data "app.js;." ^
            --add-data "logo.svg;." ^
            --add-binary "ffmpeg.exe;." ^
            --collect-all yt_dlp ^
            server.py

      - name: Package All 3 Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null

          # Asset 1 (Recommended): Full Windows Dependency Bundle (--onedir + ffmpeg.exe)
          Copy-Item ffmpeg.exe dist_dir/ClipHaven/ffmpeg.exe -Force
          Copy-Item README.md, LICENSE dist_dir/ClipHaven/ -Force
          Compress-Archive -Path dist_dir/ClipHaven -DestinationPath release_out/ClipHaven-Windows-EXE.zip -Force

          # Asset 2: Standalone Single-File .exe (ClipHaven.exe)
          Copy-Item dist_single/ClipHaven.exe release_out/ClipHaven.exe -Force

          # Asset 3: Lightweight Source + setup-and-run.bat Bundle
          New-Item -ItemType Directory -Force -Path staging_src/ClipHaven | Out-Null
          Copy-Item setup-and-run.bat, server.py, index.html, style.css, app.js, logo.svg, requirements.txt, pyproject.toml, README.md, CHANGELOG.md, LICENSE staging_src/ClipHaven/
          Compress-Archive -Path staging_src/ClipHaven -DestinationPath release_out/ClipHaven-Source-Bat.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipHaven-Windows-Packages
          path: |
            release_out/ClipHaven-Windows-EXE.zip
            release_out/ClipHaven.exe
            release_out/ClipHaven-Source-Bat.zip

      - name: Publish GitHub Release (on tag push or manual tag input)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release_out/ClipHaven-Windows-EXE.zip
            release_out/ClipHaven.exe
            release_out/ClipHaven-Source-Bat.zip
