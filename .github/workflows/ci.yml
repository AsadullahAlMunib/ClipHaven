name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Check
        run: ruff check server.py core/ scripts/ tests/ --select E,F --ignore E501,E402,E731
      - name: Verify PyPI Wheel & sdist Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*


  test:
    name: Automated Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pillow resvg-py
      - name: Run Unit & API Tests
        run: pytest -v
      - name: Verify Icon Generator
        run: python scripts/generate_icons.py

  android:
    name: Build & Lint Android (Debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Assemble Debug APKs & Run Lint
        run: gradle -p android assembleDebug lintDebug

  npm-cli:
    name: Verify npm CLI Package (@asadullahalmunib/cliphaven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JS Syntax & CLI Flags
        run: |
          npm run check
          node bin/cliphaven.js --version
          node bin/cliphaven.js --help
      - name: Verify npm Pack Contents
        run: npm pack --dry-run
